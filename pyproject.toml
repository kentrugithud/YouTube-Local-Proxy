[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "yt-local-proxy"
dynamic=["version"]

description = "Local proxy to bypass YouTube blocking via Cloudflare Worker"
readme = "README.md"
requires-python = ">=3.8"

license = { name = "MIT", file = "LICENSE" }

authors = [
    { name = "Flowseal" },
    { name = "kent code" }
]

keywords = [
    "youtube",
    "proxy",
    "bypass",
    "cloudflare",
    "websocket",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Customer Service",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: System :: Networking :: Firewalls",
]

dependencies = [
    "pyperclip==1.9.0",
    "certifi",
    "httpx[http2]==0.28.1",

    "psutil==5.9.8; platform_system == 'Windows' and python_version < '3.9'",
    "cryptography==41.0.7; platform_system == 'Windows' and python_version < '3.9'",
    "Pillow==10.4.0; platform_system == 'Windows' and python_version < '3.9'",

    "psutil==7.0.0; platform_system != 'Windows' or python_version >= '3.9'",
    "cryptography==46.0.5; platform_system != 'Windows' or python_version >= '3.9'",
    "Pillow==12.1.1; (platform_system != 'Windows' or python_version >= '3.9') and platform_system != 'Darwin'",

    "customtkinter==5.2.2",
    "pystray==0.19.5",
]

[project.scripts]
yt-local-proxy = "proxy.yt_proxy:main"
yt-local-proxy-tray-win = "windows:main"

[project.urls]
Source = "https://github.com/kentrugithud/YouTube-Local-Proxy"
Issues = "https://github.com/kentrugithud/YouTube-Local-Proxy/issues"

[tool.hatch.build.targets.wheel]
packages = ["proxy", "ui", "utils"]

[tool.hatch.build.force-include]
"windows.py" = "windows.py"

[tool.hatch.version]
path = "proxy/__init__.py"

[tool.ruff]
target-version = "py38"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "C4"]
ignore = ["F403", "F405", "B023"]

